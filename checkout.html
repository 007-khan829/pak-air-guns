<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.classList.add('js');</script>
  <title>Checkout | PAK AIR GUNS - Fast WhatsApp Order Confirmation</title>
  <meta name="description" content="Place your air rifle order on WhatsApp. Open the parcel first, then send payment. Nationwide delivery Rs 1,500.">
  <link rel="canonical" href="./checkout.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Checkout | PAK AIR GUNS">
  <meta property="og:description" content="Complete your delivery information and place order directly on WhatsApp. Open parcel first, then pay.">
  <meta property="og:image" content="images/products/product-01.jpg">
  <meta property="og:url" content="./checkout.html">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">

  <!-- Slim Sticky Header -->
  <header id="site-header"></header>

  <main>
    <header class="section" style="padding: 44px 0 20px;">
      <div class="container">
        <h1 style="margin-bottom: 10px;">Direct <span class="gold-text">Checkout</span></h1>
        <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 680px;">
          Enter your delivery details to generate your official order on WhatsApp. Pay only after opening your parcel.
        </p>
      </div>
    </header>

    <div class="container">
      <div class="checkout-layout" id="checkout-layout-view">
        <!-- Customer Details Form -->
        <div class="form-card">
          <h2 style="font-size: 1.45rem; margin-bottom: 20px; color: #fff;">Delivery Information</h2>

          <form id="checkout-form" novalidate>
            <div class="form-group">
              <label for="cust-name" class="form-label">
                Full Name <span style="color: var(--gold-primary);">*</span>
              </label>
              <input type="text" id="cust-name" class="form-input" placeholder="e.g. Muhammad Ali" required autocomplete="name">
              <span class="field-error" id="cust-name-error">Please enter your full name</span>
            </div>

            <div class="form-group">
              <label for="cust-phone" class="form-label">
                WhatsApp / Phone Number <span style="color: var(--gold-primary);">*</span>
              </label>
              <input type="tel" id="cust-phone" class="form-input" placeholder="e.g. 03102157098 or +923102157098" required autocomplete="tel">
              <span class="field-error" id="cust-phone-error">Please enter a valid mobile number</span>
            </div>

            <div class="form-group">
              <label for="cust-address" class="form-label">
                Complete Street Address <span style="color: var(--gold-primary);">*</span>
              </label>
              <textarea id="cust-address" class="form-textarea" rows="3" placeholder="House/Shop #, Street name, Area, Landmark" required autocomplete="street-address"></textarea>
              <span class="field-error" id="cust-address-error">Please enter your complete shipping address</span>
            </div>

            <div class="form-group">
              <label for="cust-city" class="form-label">
                City / Town <span style="color: var(--gold-primary);">*</span>
              </label>
              <input type="text" id="cust-city" class="form-input" placeholder="e.g. Lahore, Karachi, Rawalpindi" required autocomplete="address-level2">
              <span class="field-error" id="cust-city-error">Please specify your delivery city</span>
            </div>

            <button type="submit" class="btn btn-gold btn-block" style="font-size: 1.15rem; margin-top: 10px;">
              Generate Order on WhatsApp &rarr;
            </button>
          </form>
        </div>

        <!-- Order Summary Card -->
        <div class="cart-summary-card" id="checkout-summary-container">
          <!-- Rendered dynamically by app.js -->
        </div>
      </div>
    </div>
  </main>

  <!-- Shared Footer -->
  <footer id="site-footer"></footer>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>

  <!-- Scripts -->
  <script src="js/config.js" defer></script>
  <script src="js/products.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
